// signer/signer.proto — shared messages for all Tricorn signing services (unchanged contract).
// Used by bridge-orchestrator, orchestrator-listener, listener-enclave, and upstream BridgeSigner /
// SignerNode / ConnectorBridge patterns.
syntax = "proto3";

package tricorn;

enum DataType {
  TRANSACTION = 0;
  SIGNATURE = 1;
  COMMISSION = 2;
  SWAP = 3;
  UNSPENDABLE = 4;
  OWNER_MULTIPLE_SIGNATURE = 5;
  EVM_GAS_TX = 6;
  // Plain-BTC PSBT signing (create_utxo, plain BTC withdrawals) that carries
  // no RGB consignment and no EVM correlation. Routed to a dedicated enclave
  // handler that enforces a pinned output allowlist + amount cap — NOT the
  // bridge/RGB SignPsbt path. Making this an explicit type (rather than
  // inferring "plain BTC" from an empty evm_tx_hash on a TRANSACTION payload)
  // is the M-01/#69 fix: the bridge path can no longer be reached by field
  // omission, and an un-migrated listener that omits the consignment on a
  // TRANSACTION payload fails closed instead of silently signing.
  BTC_UTXO = 7;
}

message SignRequest {
  uint32 network_id = 1;
  DataType data_type = 2;
  bytes data = 3;
  repeated int64 inputs = 4;
  optional string algorithm = 5;
}

message Signature {
  uint32 network_id = 1;
  bytes signature = 2;
}

message PublicKeyRequest {
  uint32 network_id = 1;
  DataType data_type = 2;
  optional string algorithm = 3;
}

message PublicKeyResponse {
  bytes public_key = 1;
}
